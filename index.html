<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>이야기의 문 — 마음을 읽는 치유 동화</title>
<meta property="og:title" content="이야기의 문">
<meta property="og:description" content="당신의 마음을 읽고, 당신만을 위한 치유 동화를 지어드립니다.">
<meta property="og:image" content="https://bookcreation-blond.vercel.app/assets/og.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0e1430; --deep:#1a2340; --deep2:#26325c;
  --candle:#f0c36b; --candle-soft:#f8dfa8;
  --paper:#f7eeda; --paper-dim:#e9ddc3;
  --rose:#dd8f7e; --mint:#7fd0c6;
  --line:rgba(240,195,107,.35);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Gowun Dodum',sans-serif; background:var(--ink); color:var(--paper);
  overflow:hidden; position:fixed; inset:0; width:100%;
  background:radial-gradient(120% 90% at 50% 110%, #232f57 0%, #141b38 45%, #0b1029 100%);
}
body.kid{
  background:radial-gradient(120% 90% at 50% 110%, #33447f 0%, #1d2a5c 45%, #101740 100%);
  --candle:#ffd166; --rose:#ff8e7a; --mint:#6ec8c0;
}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.screen{position:fixed;inset:0;z-index:2;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));text-align:center;
  overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen.on{display:flex;animation:fadein .7s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1,h2,.serif{font-family:'Gowun Batang',serif}
.eyebrow{letter-spacing:.35em;font-size:.72rem;color:var(--candle-soft);opacity:.85;margin-bottom:14px}

/* ── 입장: 빛나는 문 ── */
.door{
  width:min(46vw,180px);aspect-ratio:10/16;border-radius:999px 999px 6px 6px;position:relative;margin:26px auto;
  border:2px solid var(--line);
  background:linear-gradient(180deg,#2b3763,#1a2340);
  box-shadow:0 0 60px rgba(240,195,107,.15), inset 0 0 40px rgba(0,0,0,.5);
  transition:box-shadow .6s;
}
.door::before{ /* 문틈으로 새는 빛 */
  content:"";position:absolute;left:50%;top:8%;bottom:0;width:3px;transform:translateX(-50%);
  background:linear-gradient(180deg,var(--candle-soft),var(--candle));
  box-shadow:0 0 24px 6px rgba(240,195,107,.55);
  animation:breath 2.8s ease-in-out infinite;
}
.door::after{content:"";position:absolute;left:32%;top:52%;width:9px;height:9px;border-radius:50%;
  background:var(--candle);box-shadow:0 0 12px rgba(240,195,107,.9)}
@keyframes breath{0%,100%{opacity:.55}50%{opacity:1}}
.tap:hover .door, .tap:active .door{box-shadow:0 0 90px rgba(240,195,107,.35), inset 0 0 40px rgba(0,0,0,.5)}
.tap{cursor:pointer;background:none;border:none;color:inherit;font:inherit}
.doorimg{display:block;margin:24px auto;width:min(62vw,240px);border-radius:16px;
  box-shadow:0 0 60px rgba(240,195,107,.28), 0 18px 44px rgba(0,0,0,.5);transition:box-shadow .5s,transform .4s}
.tap:hover .doorimg,.tap:active .doorimg{box-shadow:0 0 95px rgba(240,195,107,.5), 0 18px 44px rgba(0,0,0,.5);transform:scale(1.02)}
.mode-card .doorimg{width:min(38vw,175px);margin:0 auto 14px}
.pickcard .cardimg{width:92px;height:92px;object-fit:cover;border-radius:12px;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.pickcard .orbimg{width:70px;height:70px;border-radius:50%;object-fit:cover;filter:drop-shadow(0 0 10px rgba(240,195,107,.3))}
.pickcard.picked .cardimg,.pickcard.picked .orbimg{box-shadow:0 0 20px rgba(240,195,107,.55)}
.hint{font-size:.9rem;opacity:.7;animation:breath 2.8s ease-in-out infinite}
.fields{display:flex;flex-direction:column;gap:12px;margin:26px 0 22px;width:min(88vw,380px)}
.tin{font:inherit;font-size:1.05rem;padding:14px 18px;border-radius:14px;text-align:center;
  border:1px solid rgba(247,238,218,.3);background:rgba(255,255,255,.06);color:var(--paper)}
.tin:focus{outline:none;border-color:var(--candle);box-shadow:0 0 14px rgba(240,195,107,.25)}
.tin::placeholder{color:rgba(247,238,218,.45)}
.agree{font-size:.82rem;opacity:.85;display:flex;gap:9px;align-items:flex-start;text-align:left;line-height:1.6;cursor:pointer}
.agree input{margin-top:3px;accent-color:var(--candle);width:16px;height:16px;flex:none}
h1.title{font-size:clamp(1.9rem,6vw,3rem);font-weight:700;letter-spacing:.12em;
  text-shadow:0 0 30px rgba(240,195,107,.35)}
.sub{margin-top:10px;font-size:clamp(.9rem,2.6vw,1.05rem);opacity:.8;line-height:1.7}

/* ── 문 열림 전환 오버레이 ── */
#doorwipe{position:fixed;inset:0;z-index:50;display:none;pointer-events:none}
#doorwipe.go{display:block}
#doorwipe .panel{position:absolute;top:0;bottom:0;width:51%;background:#0a0f24;transition:transform 1.1s cubic-bezier(.7,0,.3,1)}
#doorwipe .L{left:0;transform:translateX(0)} #doorwipe .R{right:0;transform:translateX(0)}
#doorwipe.open .L{transform:translateX(-102%)} #doorwipe.open .R{transform:translateX(102%)}
#doorwipe .glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%, rgba(248,223,168,.9), rgba(240,195,107,.25) 30%, transparent 60%);
  opacity:0;transition:opacity .5s}
#doorwipe.open .glow{opacity:1;transition:opacity .35s}

/* ── 모드 선택 ── */
.mode-wrap{display:flex;gap:clamp(18px,5vw,48px);margin-top:26px;flex-wrap:wrap;justify-content:center}
.mode-card{cursor:pointer;background:none;border:none;color:inherit;font:inherit;transition:transform .3s}
.mode-card:hover{transform:translateY(-6px)}
.mode-card .door{width:min(34vw,150px);margin:0 auto 14px}
.mode-card.kidd .door{background:linear-gradient(180deg,#3d68a8,#2a4f92);border-color:rgba(255,209,102,.5)}
.mode-card.kidd .door::before{background:linear-gradient(180deg,#fff3c4,#ffd166);box-shadow:0 0 24px 6px rgba(255,209,102,.6)}
.mode-card h2{font-size:1.25rem;margin-bottom:6px}
.mode-card p{font-size:.85rem;opacity:.75;line-height:1.6}

/* ── 카드 라운드 ── */
.round-head{max-width:640px}
.candles{display:flex;gap:14px;justify-content:center;margin-bottom:16px}
.candle{width:10px;height:26px;border-radius:4px 4px 2px 2px;background:#3a4570;position:relative;transition:background .4s}
.candle.lit{background:linear-gradient(180deg,var(--candle-soft),var(--candle))}
.candle.lit::before{content:"";position:absolute;top:-10px;left:50%;transform:translateX(-50%);
  width:8px;height:11px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:radial-gradient(circle at 50% 70%, #fff6d8, var(--candle));
  box-shadow:0 0 14px rgba(240,195,107,.9);animation:flick .6s ease-in-out infinite alternate}
@keyframes flick{from{transform:translateX(-50%) scale(1)}to{transform:translateX(-52%) scale(1.12)}}
.round-q{font-size:clamp(1.15rem,4vw,1.6rem);line-height:1.5;font-weight:700}
.round-note{font-size:.85rem;opacity:.7;margin-top:8px}
.cards{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:720px;margin:26px auto 20px}
.wcard{
  font-family:'Gowun Batang',serif;font-size:clamp(.95rem,3vw,1.08rem);
  padding:13px 20px;border-radius:999px;cursor:pointer;color:var(--paper);
  background:rgba(255,255,255,.05);border:1px solid rgba(247,238,218,.22);
  backdrop-filter:blur(4px);transition:all .25s;animation:float 5s ease-in-out infinite;
}
body.kid .wcard{font-size:clamp(1.05rem,3.6vw,1.2rem);padding:15px 24px}
.wcard:nth-child(3n){animation-delay:-1.7s}.wcard:nth-child(3n+1){animation-delay:-3.2s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.wcard:hover{border-color:var(--line)}
.wcard.addw{border-style:dashed;opacity:.85;animation:none}
.wcard.picked{background:linear-gradient(135deg,rgba(240,195,107,.22),rgba(221,143,126,.18));
  border-color:var(--candle);color:#fff;box-shadow:0 0 20px rgba(240,195,107,.35);animation:none;transform:scale(1.05)}
.sense{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:620px;margin:26px auto 20px}
.swatch{width:56px;height:56px;border-radius:50%;cursor:pointer;border:3px solid transparent;
  box-shadow:inset 0 -6px 14px rgba(0,0,0,.25);transition:.25s;padding:0}
.swatch.picked{border-color:#fff;box-shadow:0 0 20px rgba(255,255,255,.55), inset 0 -6px 14px rgba(0,0,0,.25);transform:scale(1.14)}
.pickcard{font:inherit;width:104px;padding:14px 8px 12px;border-radius:16px;cursor:pointer;color:var(--paper);
  background:rgba(255,255,255,.05);border:1px solid rgba(247,238,218,.2);
  display:flex;flex-direction:column;align-items:center;gap:9px;transition:.25s}
.pickcard svg{width:54px;height:54px;stroke:var(--paper);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pickcard .lbl{font-size:.78rem;opacity:.88;line-height:1.4}
.pickcard .orb{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.25rem;
  background:radial-gradient(circle at 35% 28%, rgba(255,255,255,.4), rgba(255,255,255,.06));border:1px solid rgba(247,238,218,.25)}
.pickcard.picked{border-color:var(--candle);background:linear-gradient(135deg,rgba(240,195,107,.2),rgba(221,143,126,.15));
  box-shadow:0 0 20px rgba(240,195,107,.35);transform:translateY(-3px)}
.pickcard.picked svg{stroke:var(--candle-soft)}
.btn{
  font:inherit;font-weight:700;cursor:pointer;border:none;border-radius:999px;
  padding:15px 42px;font-size:1.05rem;color:#231a08;
  background:linear-gradient(135deg,var(--candle-soft),var(--candle));
  box-shadow:0 6px 24px rgba(240,195,107,.35);transition:opacity .3s,transform .2s;
}
.btn:disabled{opacity:.28;cursor:default;box-shadow:none}
.btn:not(:disabled):active{transform:scale(.96)}
.btn.ghost{background:none;color:var(--paper);border:1px solid rgba(247,238,218,.35);box-shadow:none;font-weight:400}

/* ── 로딩 ── */
.load-door{width:min(40vw,150px)}
#loadmsg{margin-top:22px;font-size:1.05rem;min-height:1.6em}
.dots::after{content:"";animation:dots 1.5s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
#loadread{margin-top:14px;font-size:.88rem;opacity:.75;line-height:1.8;max-width:520px}
.pbar{width:min(72vw,320px);height:9px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:22px}
#pfill{display:block;height:100%;width:0;border-radius:99px;transition:width .7s ease;
  background:linear-gradient(90deg,var(--candle-soft),var(--candle));box-shadow:0 0 12px rgba(240,195,107,.7)}
#pstat{margin-top:10px;font-size:.86rem;color:var(--candle-soft)}
.srclist{font-size:.8rem;line-height:1.78;color:#6b5a35;overflow-y:auto;padding-right:6px;text-align:left}
.srclist b{display:block;color:#4a3617;margin:14px 0 3px;font-size:.86rem}
.srclist b:first-child{margin-top:0}
.srcnote{display:block;margin-top:18px;padding-top:14px;border-top:1px dashed #c9b184;font-size:.78rem;color:#8a7350}

/* ── 동화책 뷰어 ── */
#scr-book{justify-content:flex-start;padding-top:max(14px,env(safe-area-inset-top))}
.bookbar{display:flex;gap:8px;align-items:center;justify-content:space-between;width:100%;max-width:1060px;margin-bottom:10px}
.bookbar .bt{font:inherit;font-size:.82rem;padding:8px 14px;border-radius:999px;cursor:pointer;
  background:rgba(255,255,255,.07);border:1px solid rgba(247,238,218,.25);color:var(--paper)}
.bookbar .bt:hover{border-color:var(--line)}
.book{width:100%;max-width:1060px;flex:1;display:flex;flex-direction:column;min-height:0}
.stage{flex:1;position:relative;min-height:0}
.page{position:absolute;inset:0;display:none}
.page.cur{display:block;animation:pagein .55s ease both}
@keyframes pagein{from{opacity:0;transform:translateX(26px) rotateY(6deg)}to{opacity:1;transform:none}}
.spread{height:100%;display:grid;grid-template-columns:1fr 1.05fr;gap:0;border-radius:14px;overflow:hidden;
  background:var(--paper);color:#3a2f22;box-shadow:0 20px 60px rgba(0,0,0,.5), inset 0 0 0 1px rgba(0,0,0,.06)}
.art{position:relative;background:#ddd2ba;min-height:0}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art .ph{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;
  color:#8a7a5c;font-size:.9rem;background:repeating-linear-gradient(45deg,#e5dac2,#e5dac2 12px,#ded2b8 12px,#ded2b8 24px);
  background-size:200% 200%;animation:shimmer 2.2s linear infinite}
@keyframes shimmer{from{background-position:0 0}to{background-position:60px 60px}}
.art .retry{font:inherit;font-size:.8rem;padding:7px 14px;border-radius:999px;border:1px solid #b9a87f;background:#f2e8cf;cursor:pointer;color:#6b5a35}
.txt{padding:clamp(20px,3.5vw,46px);overflow-y:auto;display:flex;flex-direction:column;justify-content:center}
.txt .chap{font-size:.72rem;letter-spacing:.3em;color:#a3865a;margin-bottom:14px}
.txt .body{font-family:'Gowun Batang',serif;font-size:clamp(1rem,1.7vw,1.13rem);line-height:2.05;white-space:pre-wrap;text-align:left}
body.kid .txt .body{font-size:clamp(1.08rem,2vw,1.25rem);line-height:2.15}
.txt h2.cover-t{font-size:clamp(1.7rem,3.4vw,2.5rem);line-height:1.5;margin-bottom:16px;color:#4a3617}
.txt .cover-s{font-size:.95rem;color:#8a7350;line-height:1.8}
.closing-page .txt{align-items:center;text-align:center}
.rx{margin-top:20px;padding:18px 20px;border:1px dashed #c9b184;border-radius:12px;font-size:.9rem;line-height:1.9;color:#6b5a35;text-align:left}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 4px 2px}
.nav .arrow{font:inherit;width:46px;height:46px;border-radius:50%;cursor:pointer;font-size:1.2rem;
  background:rgba(255,255,255,.08);border:1px solid rgba(247,238,218,.3);color:var(--paper)}
.nav .arrow:disabled{opacity:.25;cursor:default}
.pgdots{display:flex;gap:8px}
.pgdots i{width:8px;height:8px;border-radius:50%;background:rgba(247,238,218,.25);transition:all .3s}
.pgdots i.cur{background:var(--candle);box-shadow:0 0 8px rgba(240,195,107,.7)}

/* 스크롤 모드 */
.book.scroll .stage{overflow-y:auto}
.book.scroll .page{position:static;display:block;margin-bottom:26px;animation:none}
.book.scroll .spread{height:auto;grid-template-columns:1fr}
.book.scroll .art{aspect-ratio:2/3;max-height:70vh}
.book.scroll .nav{display:none}

/* 모바일 세로 */
@media (max-width:760px), (orientation:portrait){
  .spread{grid-template-columns:1fr;grid-template-rows:minmax(0,1.15fr) minmax(0,1fr)}
  .txt{justify-content:flex-start}
  .txt .body{font-size:1.14rem;line-height:2.0}
  body.kid .txt .body{font-size:1.26rem}
  .txt h2.cover-t{font-size:2rem}
  .round-q{font-size:1.42rem}
  .round-note{font-size:.95rem}
  .wcard{font-size:1.08rem;padding:14px 22px}
  body.kid .wcard{font-size:1.18rem;padding:16px 24px}
  .pickcard .lbl{font-size:.88rem}
  .btn{font-size:1.12rem;padding:16px 46px}
  .srclist{font-size:.9rem}
}
#sndbtn{position:fixed;top:max(12px,env(safe-area-inset-top));right:14px;z-index:60;width:42px;height:42px;border-radius:50%;
  cursor:pointer;font-size:1.05rem;background:rgba(10,15,36,.55);border:1px solid rgba(247,238,218,.3);color:var(--paper)}
.errbox{margin-top:16px;font-size:.9rem;color:#f3b8a6;line-height:1.7;max-width:480px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<button id="sndbtn" aria-label="소리 켜기/끄기">♪</button>

<div id="doorwipe"><div class="glow"></div><div class="panel L"></div><div class="panel R"></div></div>

<!-- 1. 입장 -->
<section class="screen on" id="scr-enter">
  <p class="eyebrow">MIND · TALE</p>
  <h1 class="title">이야기의 문</h1>
  <p class="sub">문 너머에는 당신의 마음을 닮은 이야기가 살고 있어요.<br>몇 개의 단어만 고르면, 당신만을 위한 동화가 지어집니다.</p>
  <button class="tap" id="enterBtn"><img class="doorimg" src="assets/door-main.webp" alt="빛나는 이야기의 문"><p class="hint">문을 두드려 주세요</p></button>
</section>

<!-- 2. 모드 선택 -->
<section class="screen" id="scr-mode">
  <p class="eyebrow">어느 문으로 들어갈까요</p>
  <h2 class="round-q serif">두 개의 문이 있어요</h2>
  <div class="mode-wrap">
    <button class="mode-card kidd" data-mode="kid"><img class="doorimg" src="assets/door-kid.webp" alt="아이의 문">
      <h2 class="serif">아이의 문</h2><p>알록달록한 그림과<br>쉬운 말로 지은 동화</p></button>
    <button class="mode-card" data-mode="adult"><img class="doorimg" src="assets/door-adult.webp" alt="어른의 문">
      <h2 class="serif">어른의 문</h2><p>마음 깊은 곳을 어루만지는<br>은유의 동화</p></button>
  </div>
</section>

<!-- 2.5 문패 -->
<section class="screen" id="scr-info">
  <p class="eyebrow">문패를 걸어주세요</p>
  <h2 class="round-q serif">이야기의 문에는<br>이름이 새겨진 문패가 필요해요</h2>
  <div class="fields">
    <input id="uName" class="tin" maxlength="20" placeholder="이름 (필수)">
    <input id="uContact" class="tin" maxlength="40" placeholder="네이버 아이디 또는 전화번호 (필수)">
    <label class="agree"><input type="checkbox" id="uAgree"> 입력한 이름·연락처와 완성된 동화(글)가 운영자에게 전달되어 보관되는 것에 동의합니다.</label>
  </div>
  <button class="btn" id="infoBtn">문패 걸고 들어가기</button>
</section>

<!-- 3. 카드 라운드 -->
<section class="screen" id="scr-cards">
  <div class="round-head">
    <div class="candles" id="candles"></div>
    <h2 class="round-q serif" id="roundQ"></h2>
    <p class="round-note" id="roundNote"></p>
  </div>
  <div class="cards" id="cardGrid"></div>
  <button class="btn" id="nextBtn" disabled>다음</button>
</section>

<!-- 4. 로딩 -->
<section class="screen" id="scr-loading">
  <div class="door load-door"></div>
  <p id="loadmsg" class="serif dots">마음의 별자리를 읽는 중</p>
  <div class="pbar"><i id="pfill"></i></div>
  <p id="pstat"></p>
  <p id="loadread"></p>
  <div class="errbox" id="loaderr" style="display:none"></div>
</section>

<!-- 5. 동화책 -->
<section class="screen" id="scr-book">
  <div class="bookbar">
    <button class="bt" id="homeBtn">↩ 처음으로</button>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
      <button class="bt" id="viewBtn">≡ 이어보기</button>
      <button class="bt" id="dlTxt">글 저장</button>
      <button class="bt" id="dlImg">이 그림 저장</button>
      <button class="bt" id="dlBook">동화책 저장</button>
    </div>
  </div>
  <div class="book" id="book">
    <div class="stage" id="stage"></div>
    <div class="nav">

/* ═══════════ 사운드 (Web Audio 합성 — 파일 불필요) ═══════════ */
const Snd = {
  ctx:null, muted:false, amb:null,
  boot(){ if(this.ctx) return;
    this.ctx = new (window.AudioContext||window.webkitAudioContext)();
    this.master = this.ctx.createGain(); this.master.gain.value=.9; this.master.connect(this.ctx.destination);
  },
  env(t=0.3,peak=.25){ const g=this.ctx.createGain(); const n=this.ctx.currentTime;
    g.gain.setValueAtTime(0,n); g.gain.linearRampToValueAtTime(peak,n+.02); g.gain.exponentialRampToValueAtTime(.0001,n+t);
    g.connect(this.master); return g; },
  tone(freq,type,t,peak){ if(!this.ctx||this.muted) return; const o=this.ctx.createOscillator();
    o.type=type; o.frequency.value=freq; o.connect(this.env(t,peak)); o.start(); o.stop(this.ctx.currentTime+t); },
  ting(){ this.tone(1046,'sine',.5,.18); this.tone(1568,'sine',.4,.08); },
  tick(){ this.tone(330,'sine',.12,.1); },
  door(){ if(!this.ctx||this.muted) return; const o=this.ctx.createOscillator(); const n=this.ctx.currentTime;
    o.type='sine'; o.frequency.setValueAtTime(180,n); o.frequency.exponentialRampToValueAtTime(720,n+1);
    o.connect(this.env(1.2,.15)); o.start(); o.stop(n+1.2);
    this.tone(523,'triangle',1.4,.06); },
  page(){ if(!this.ctx||this.muted) return; const n=this.ctx.currentTime;
    const buf=this.ctx.createBuffer(1,this.ctx.sampleRate*.25,this.ctx.sampleRate);
    const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
    const src=this.ctx.createBufferSource(); src.buffer=buf;
    const f=this.ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.setValueAtTime(900,n); f.frequency.exponentialRampToValueAtTime(2400,n+.2);
    src.connect(f); f.connect(this.env(.25,.14)); src.start(); },
  chime(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>this.tone(f,'sine',.8,.12),i*140)); },
  preview(kind){ this.boot(); if(this.muted) return;
    if(kind==='calm'){ this.tone(220,'sine',1.6,.12); this.tone(277,'sine',1.6,.08); this.tone(330,'sine',1.4,.05); }
    else if(kind==='playful'){ [523,659,784,659,880].forEach((f,i)=>setTimeout(()=>this.tone(f,'triangle',.22,.16),i*130)); }
    else if(kind==='deep'){ this.tone(98,'sine',2.2,.2); this.tone(196,'sine',2,.07); }
    else if(kind==='sparkle'){ [1568,1319,1760,2093].forEach((f,i)=>setTimeout(()=>this.tone(f,'sine',.7,.09),i*160)); } },
  ambient(on){ if(!this.ctx) return;
    if(!on){ if(this.amb){this.amb.g.gain.linearRampToValueAtTime(0,this.ctx.currentTime+1); this.amb=null;} return; }
    if(this.amb||this.muted) return;
    const g=this.ctx.createGain(); g.gain.value=0; g.connect(this.master);
    const mk=(f,det)=>{const o=this.ctx.createOscillator();o.type='sine';o.frequency.value=f;o.detune.value=det;o.connect(g);o.start();return o;};
    const os=[mk(110,0),mk(164.8,4),mk(220,-3)];
    g.gain.linearRampToValueAtTime(.035,this.ctx.currentTime+3);
    const lfo=this.ctx.createOscillator(), lg=this.ctx.createGain();
    lfo.frequency.value=.08; lg.gain.value=.015; lfo.connect(lg); lg.connect(g.gain); lfo.start();
    this.amb={g,os,lfo};
  }
};
const sndbtn=document.getElementById('sndbtn');
sndbtn.onclick=()=>{ Snd.boot(); Snd.muted=!Snd.muted; sndbtn.textContent=Snd.muted?'∅':'♪';
  if(Snd.muted) Snd.ambient(false); else Snd.ambient(true); };

/* ═══════════ 별 캔버스 ═══════════ */
const cv=document.getElementById('stars'), cx=cv.getContext('2d');
let stars=[];
function seed(){ cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio;
  stars=Array.from({length:Math.min(140,innerWidth/4)},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,
    r:Math.random()*1.6+.4,p:Math.random()*Math.PI*2,s:.5+Math.random()}));}
seed(); addEventListener('resize',seed);
(function loop(t){ cx.clearRect(0,0,cv.width,cv.height);
  for(const s of stars){ const a=.25+.55*Math.abs(Math.sin(t/1400*s+s.p));
    cx.beginPath(); cx.arc(s.x,s.y,s.r*devicePixelRatio,0,7); cx.fillStyle=`rgba(248,223,168,${a})`; cx.fill(); }
  requestAnimationFrame(loop); })(0);

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},
             set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
(function(){ try{ const m=new URLSearchParams(location.search).get('master'); if(m) store.set('sd_master',m); }catch(e){} })();
const MASTER=store.get('sd_master')||'';
function lifeCount(){ const a=parseInt(store.get('sd_life')||'0')||0;
  let b=0; try{ const c=(document.cookie.match(/(?:^|; )sdlc=(\d+)/)||[])[1]; b=parseInt(c||'0')||0; }catch(e){}
  return Math.max(a,b); }
function lifeUp(){ const n=lifeCount()+1; store.set('sd_life',String(n));
  try{ document.cookie='sdlc='+n+'; max-age=315360000; path=/; SameSite=Lax'; }catch(e){} }
function lifeLocked(){ return !MASTER && lifeCount()>=2; }

const EMPTY_PICKS=()=>({colors:[],shape:[],style:[],detail:[],abstract:[],space:[],sound:[],weather:[],emotions:[],memories:[],desires:[],avoids:[],metaphors:[]});
const S={mode:null, round:0, picks:EMPTY_PICKS(), user:{name:'',contact:''}, story:null, images:[null,null,null,null], analysis:null, page:0};
const $=id=>document.getElementById(id);
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on')); $(id).classList.add('on'); }
function doorWipe(cb){ const w=$('doorwipe'); w.classList.add('go'); w.classList.remove('open');
  Snd.door(); requestAnimationFrame(()=>requestAnimationFrame(()=>{ cb(); w.classList.add('open');
    setTimeout(()=>w.classList.remove('go'),1200); })); }

$('enterBtn').onclick=()=>{ Snd.boot(); if(!Snd.muted) Snd.ambient(true); Snd.ting(); show('scr-mode'); };
document.querySelectorAll('.mode-card').forEach(b=>b.onclick=()=>{
  if(lifeLocked()){ alert('이야기의 문은 한 사람에게 평생 두 번 열립니다.\n당신의 두 이야기는 이미 지어졌어요. 오래 간직해 주세요.'); return; }
  S.mode=b.dataset.mode; document.body.classList.toggle('kid',S.mode==='kid');
  S.round=0; S.picks=EMPTY_PICKS();
  Snd.ting(); show('scr-info'); setTimeout(()=>$('uName').focus(),400);
});
$('infoBtn').onclick=()=>{

  if(!name){ alert('문패에 새길 이름을 적어주세요.'); $('uName').focus(); return; }

/* ═══════════ 카드 라운드 ═══════════ */
function renderRound(){
  const r=ROUNDS[S.round];
  const cd=$('candles'); cd.innerHTML='';
  for(let i=0;i<ROUNDS.length;i++){ const c=document.createElement('span');
    c.className='candle'+(i<S.round?' lit':''); cd.appendChild(c); }
  $('roundQ').textContent=''; (S.mode==='kid'?r.kid:r.adult).split('\n').forEach((line,i)=>{
    if(i) $('roundQ').appendChild(document.createElement('br'));
    $('roundQ').appendChild(document.createTextNode(line)); });
  $('roundNote').textContent=r.note;
  const grid=$('cardGrid'); grid.innerHTML='';
  grid.className = r.type==='word' ? 'cards' : 'sense';
  const items = r.type==='word' ? BANK[S.mode][r.key]
    : r.type==='abstract' ? BANK[S.mode].abstracts
    : SENSE[{color:'colors',shape:'shapes',style:'styles',detail:'details',space:'spaces',sound:'sounds'}[r.type]];
  items.forEach(item=>{
    let b=document.createElement('button');
    if(r.type==='color'){ b.className='swatch'; b.style.background=item.c; b.title=item.w; b.setAttribute('aria-label',item.w); }
    else if(r.type==='word'){ b.className='wcard'; b.textContent=item.w; }
    else { b.className='pickcard';
      if(item.img){ const im=document.createElement('img'); im.src=item.img; im.alt='';
        im.className=r.type==='sound'?'orbimg':'cardimg'; b.appendChild(im); }
      else if(r.type==='sound'){ const o=document.createElement('div'); o.className='orb'; o.textContent=item.icon; b.appendChild(o); }
      else { b.innerHTML='<svg viewBox="0 0 64 64" aria-hidden="true">'+item.svg+'</svg>'; }
      const l=document.createElement('span'); l.className='lbl'; l.textContent=item.w; b.appendChild(l); }
    b.onclick=()=>{
      if(r.type==='sound') Snd.preview(item.k);
      const arr=S.picks[r.key]; const i=arr.indexOf(item.w);
      if(i>=0){ arr.splice(i,1); b.classList.remove('picked'); if(r.type!=='sound') Snd.tick(); }
      else if(r.pick===1){ arr.length=0; grid.querySelectorAll('.picked').forEach(x=>x.classList.remove('picked'));
        arr.push(item.w); b.classList.add('picked'); if(r.type!=='sound') Snd.ting(); }
      else if(arr.length<r.pick){ arr.push(item.w); b.classList.add('picked'); if(r.type!=='sound') Snd.ting(); }
      $('nextBtn').disabled = arr.length!==r.pick;
      $('nextBtn').textContent = S.round===ROUNDS.length-1 ? '이야기의 문 열기' : '다음';
    };
    grid.appendChild(b);
  });
  if(r.type==='word'){
    const c=document.createElement('button'); c.className='wcard addw'; c.textContent='＋ 직접 쓰기';
    c.onclick=()=>{
      const arr=S.picks[r.key];
      if(arr.length>=r.pick){ alert('이미 '+r.pick+'개를 골랐어요. 하나를 취소한 뒤 눌러주세요.'); return; }
      const w=(window.prompt('마음에 있는 말을 직접 적어주세요 (12자 이내)')||'').trim().slice(0,12);
      if(!w) return;
      if(arr.includes(w)) return;
      arr.push(w);
      const b2=document.createElement('button'); b2.className='wcard picked'; b2.textContent=w;
      b2.onclick=()=>{ const j=arr.indexOf(w); if(j>=0){ arr.splice(j,1); b2.remove(); Snd.tick(); }
        $('nextBtn').disabled=arr.length!==r.pick; };
      grid.insertBefore(b2,c); Snd.ting();
      $('nextBtn').disabled=arr.length!==r.pick;
      $('nextBtn').textContent = S.round===ROUNDS.length-1 ? '이야기의 문 열기' : '다음';
    };
    grid.appendChild(c);
  }
  $('nextBtn').disabled=true; $('nextBtn').textContent='다음';
}
$('nextBtn').onclick=()=>{
  if(S.round<ROUNDS.length-1){ S.round++; Snd.page(); renderRound(); }
  else { S.analysis=analyze(); startCreate(); }
};

/* ═══════════ 심리 판정 엔진 ═══════════ */
function analyze(){
  const bank=BANK[S.mode]; const isKid=S.mode==='kid';
  // 1) 정서 좌표 — 감정 단어(55%) + 색(30%) + 마음 날씨(15%) 교차
  const em=bank.emotions.filter(e=>S.picks.emotions.includes(e.w));
  const wv=em.length?em.reduce((s,e)=>s+e.v,0)/em.length:0, wa=em.length?em.reduce((s,e)=>s+e.a,0)/em.length:0;
  const cs=SENSE.colors.filter(c=>S.picks.colors.includes(c.w));
  const cv=cs.length?cs.reduce((s,c)=>s+c.v,0)/cs.length:0, ca=cs.length?cs.reduce((s,c)=>s+c.a,0)/cs.length:0;
  const wx=bank.weather.find(x=>S.picks.weather.includes(x.w));
  const v=wv*.55+cv*.3+(wx?wx.lv:0)*.15, a=wa*.55+ca*.3+(wx?wx.la:0)*.15;
  // 2) 결핍 욕구 — 바람 단어 + 공간(1.5) + 기억의 결(0.5)
  const cnt={autonomy:0,competence:0,relatedness:0,safety:0};
  bank.desires.filter(d=>S.picks.desires.includes(d.w)).forEach(d=>cnt[d.n]++);
  const space=SENSE.spaces.find(s=>s.w===S.picks.space[0]); cnt[space.n]+=1.5;
  const mem=bank.memories.filter(m=>S.picks.memories.includes(m.w));
  mem.forEach(m=>{ if(m.m==='loss'||m.m==='solitude') cnt.relatedness+=.5;
    if(m.m==='warm') cnt.safety+=.3; if(m.m==='achieve') cnt.competence+=.3; });
  const need=Object.keys(cnt).sort((x,y)=>cnt[y]-cnt[x])[0];
  // 3) 팔레트 — 색(주) + 장면 단어(보조)
  const sc=bank.metaphors.filter(s=>S.picks.metaphors.includes(s.w));
  const warmVotes=cs.filter(c=>c.t==='warm').length*1.5 + sc.filter(s=>s.p==='warm').length;
  const coolVotes=cs.filter(c=>c.t==='cool').length*1.5 + sc.filter(s=>s.p==='cool').length;
  const palette = warmVotes>=coolVotes ? 'warm' : 'cool';
  // 4) 형태·소리·기억·회피
  const shape=SENSE.shapes.find(s=>s.w===S.picks.shape[0]);
  const styleChoice=SENSE.styles.find(s=>s.w===S.picks.style[0])||SENSE.styles[0];
  const det=SENSE.details.find(d=>d.w===S.picks.detail[0]);
  const absPick=bank.abstracts.find(d=>d.w===S.picks.abstract[0]);
  const sound=SENSE.sounds.find(s=>s.w===S.picks.sound[0]);
  const lively = sound.k==='playful'||sound.k==='sparkle';
  const av=bank.avoids.find(x=>S.picks.avoids.includes(x.w));
  const avoidKo=S.picks.avoids.join(', ');
  const MEMKO={warm:'따뜻한 돌봄',achieve:'해냈던 순간',loss:'상실',solitude:'홀로였던 시간'};
  const memoryKo=[...new Set(mem.map(m=>MEMKO[m.m]))].join('과 ')+'의 기억' + (S.picks.memories.some(w=>!mem.find(m=>m.w===w))?' (직접 적은 기억 포함)':'');

  const needKo={autonomy:'자유와 스스로 선택하는 힘(자율성)',competence:'해내는 기쁨과 인정(유능감)',
    relatedness:'곁에 있어주는 존재와의 연결(관계성)',safety:'안심하고 쉴 수 있는 품(안전감)'}[need];
  const moodKo = v>=0
    ? (a>=0?'밝고 활기찬 상태':'평온하고 따뜻한 상태')
    : (a>=.15?'긴장과 불안이 높은 상태 — 진정이 필요함':'기운이 가라앉고 지친 상태 — 따뜻한 온기가 필요함');

  /* ── 화풍 결정: 고른 형태가 화풍(재료) 자체를 정합니다 — 선택마다 확실히 다른 그림 ── */
  const MEDIA={
   round:{en:'soft watercolor illustration, gentle wet-on-wet blends, organic rounded forms, visible paper texture',ko:'부드러운 수채화'},
   spiky:{en:'bold paper cut-out collage illustration, layered torn and cut paper textures, crisp sharp shapes, strong contrast',ko:'대담한 종이 콜라주'},
   grid:{en:'flat geometric mid-century style illustration, clean simple shapes, balanced composition, subtle screen-print grain',ko:'기하학적 플랫 일러스트'},
   spiral:{en:'dreamlike soft-pastel surrealism, swirling flowing forms, hazy glowing edges, floating elements',ko:'몽환적 파스텔 초현실화'},
   wave:{en:'expressive East Asian ink-wash painting with light color tints, flowing calligraphic brush strokes, generous empty space',ko:'수묵 담채화'},
   arrow:{en:'linocut block-print style illustration, strong carved lines, limited bold color palette, handmade print texture',ko:'힘있는 판화'}
  };
  const absK = absPick.k==='none' ? (v<0 ? 'dream' : 'story') : absPick.k;
  const abs_=ABS_DEF[absK];
  const media = styleChoice.k==='auto' ? MEDIA[shape.k] : styleChoice;
  let styleEn=media.en+', '+abs_.en+', '+det.en, moodStyleKo;
  if(v<0 && a>=.15){ styleEn+=', muted calming palette, minimal detail, soothing quiet atmosphere'; moodStyleKo='차분히 가라앉힌 색'; }
  else if(v<0){ styleEn+=', warm golden light gradually breaking through, soft hopeful mood'; moodStyleKo='서서히 밝아지는 온기'; }
  else if(a>=.2){ styleEn+=', vivid luminous colors, joyful energy'; moodStyleKo='생기 넘치는 색'; }
  else { styleEn+=', warm rich harmonious colors, serene mood'; moodStyleKo='따뜻하고 고요한 색'; }
  if(isKid && styleChoice.k==='auto') styleEn+=', award-winning children\'s picture book quality, charming character design, expressive friendly faces, higher saturation';
  styleEn += palette==='warm' ? ', warm color palette' : ', deep blue and cool palette with warm accents';
  if(wx) styleEn += ', '+wx.lt;
  styleEn += lively ? ', lively rhythm and playful sense of movement' : ', quiet serene stillness';

  const fig={
    autonomy:{en:'a lone protagonist small within a vast open landscape, wide horizon, sense of freedom', ko:'광활한 풍경 속 주인공 홀로 — 자유의 구도'},
    competence:{en:'the protagonist in an ascending composition, reaching upward or standing accomplished, uplifting angle', ko:'위로 오르는 성취의 구도'},
    relatedness:{en:'the protagonist together with a warm companion, side by side, tender closeness', ko:'곁을 지켜주는 존재와 함께 있는 구도'},
    safety:{en:'the protagonist wrapped in a cozy sheltering space, soft enclosing light, embraced and protected', ko:'포근하게 감싸이는 안식의 구도'}
  }[need];
  if(absK==='abs'){ styleEn += ', the protagonist suggested only as a form of light and color'; }
  else { styleEn += ', '+fig.en;
    if(!isKid) styleEn += ', human figures shown from behind or as soft silhouettes'; }
  if(av) styleEn += ', peaceful and safe scene, absolutely no '+av.ae;
  styleEn += ', masterful composition and lighting, award-winning illustration quality, vertical 2:3 composition, no text, no letters, no watermark';

  const colorKo=cs.map(c=>c.w).join('·')+' 계열('+(palette==='warm'?'따뜻한 쪽':'차분한 쪽')+')';
  const senseKo=`색은 ${colorKo}, 형태는 ${shape.ko}, 자리는 ${space.w}, 소리는 ${sound.ko}`+(wx?`, 마음 날씨는 ${wx.ko}`:'');
  const styleKo=`${media.ko} · ${abs_.ko} · ${det.ko} (${moodStyleKo}${wx?', '+wx.ko+' 빛':''}) · ${fig.ko}`;
  return {v,a,need,palette,needKo,moodKo,styleKo,styleEn,
    colorKo,shapeKo:shape.ko,spaceKo:space.w,soundKo:sound.ko,memoryKo,avoidKo,senseKo};
}


/* ═══════════ 생성 (Claude → gpt-image-2) — 글과 그림이 다 완성된 뒤 책이 열립니다 ═══════════ */
const STORYMSGS=['마음의 별자리를 읽는 중','작가 요정이 첫 문장을 고르는 중','주인공에게 어울리는 이름을 짓는 중','이야기의 씨앗에 물을 주는 중','문장들이 나란히 줄을 서는 중'];
const IMGMSGS=['물감을 개는 중','붓끝에 별빛을 묻히는 중','달빛으로 밑그림을 그리는 중','금박을 조심조심 입히는 중','물감이 마르길 기다리는 중','그림 요정이 마지막 손질을 하는 중','액자의 먼지를 닦는 중'];
let loadTimer=null, msgPool=STORYMSGS;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function setProg(units,stat){
  $('pfill').style.width=Math.min(100,Math.round(units/6*100))+'%';
  if(stat) $('pstat').textContent=stat;
}
function bumpImg(){ const ok=S.images.filter(Boolean).length;
  setProg(2+ok, `이야기 완성 · 그림 ${ok}/4장 완성`); }
async function startCreate(){
  show('scr-loading'); $('loaderr').style.display='none'; Snd.door();
  const A=S.analysis;
  $('loadread').textContent=`읽어낸 마음 — ${A.moodKo}. ${A.senseKo}. 마음이 바라는 것은 ‘${A.needKo}’. 그림은 ${A.styleKo}로 그립니다.`;
  msgPool=STORYMSGS; let mi=0; $('loadmsg').textContent=msgPool[0];
  clearInterval(loadTimer); loadTimer=setInterval(()=>{ mi=(mi+1)%msgPool.length; $('loadmsg').textContent=msgPool[mi]; },3200);
  setProg(0,'이야기를 짓기 시작했어요');
  try{
    const r=await fetch('/api/story',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({mode:S.mode,picks:S.picks,master:MASTER,user:S.user,analysis:{moodKo:A.moodKo,needKo:A.needKo,styleKo:A.styleKo,senseKo:A.senseKo,memoryKo:A.memoryKo,avoidKo:A.avoidKo}})});
    const data=await r.json();
    if(!r.ok) throw new Error(data.error||'오류');
    S.story=data.story; S.recId=data.recId||null; S.images=[null,null,null,null]; S.page=0;
    if(!MASTER) lifeUp();
    buildBook();
    msgPool=IMGMSGS; setProg(2,'이야기 완성! 이제 그림을 그려요 (2~4분 걸릴 수 있어요)');
    for(const pair of [[0,1],[2,3]]) await Promise.all(pair.map(i=>fetchOneAuto(i)));
    clearInterval(loadTimer);
    const fails=4-S.images.filter(Boolean).length;
    setProg(6, fails? `그림 ${fails}장은 완성하지 못했어요 — 책 안에서 다시 그릴 수 있어요` : '동화책이 완성됐어요!');
    Snd.chime(); await sleep(700);
    doorWipe(()=>show('scr-book'));
  }catch(e){
    clearInterval(loadTimer);
    $('loadmsg').textContent='문이 열리지 않았어요';

    rb.onclick=startCreate; eb.appendChild(rb);
    const hb=document.createElement('button'); hb.className='btn ghost'; hb.style.margin='12px 0 0 8px'; hb.textContent='처음으로';
    hb.onclick=()=>location.reload(); eb.appendChild(hb);
  }
}
function imagePrompt(i){ // 0=표지, 1~3=장면
  const base = i===0 ? S.story.coverImagePrompt : S.story.scenes[i-1].imagePrompt;
  return base+', '+S.analysis.styleEn;
}
async function fetchOnce(i){
  const r=await fetch('/api/image',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({prompt:imagePrompt(i),master:MASTER,recId:S.recId,slot:i})});
  const data=await r.json();
  if(!r.ok) throw new Error(data.error||'오류');
  let b64, mime='image/png';
  if(data.chunked){ // 원본이 커서 저장소에서 조각으로 받아 조립
    let s='', off=0;
    while(true){
      const rr=await fetch('/api/imgpart',{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify({recId:S.recId,slot:i,offset:off})});
      const dd=await rr.json();
      if(!rr.ok) throw new Error(dd.error||'오류');
      s+=dd.part; off+=dd.part.length;
      if(dd.done) break;
    }
    if(!s) throw new Error('그림 데이터를 받지 못했어요');
    const p=s.indexOf('|'); mime=s.slice(0,p); b64=s.slice(p+1);
  } else { b64=data.b64; mime=data.mime||'image/png'; }
  S.images[i]='data:'+mime+';base64,'+b64; // 원본 화질 그대로 보관 (인쇄용)
  placeImg(i);
}
async function fetchOneAuto(i){ // 실패 시 자동 2회 재시도
  for(let t=1;t<=3;t++){
    try{ await fetchOnce(i); bumpImg(); return; }
    catch(e){ if(t===3) setPh(i,e.message,true);
      else { setPh(i,`잘 안 그려져서 다시 그리는 중 (${t+1}번째 시도)…`,false); await sleep(t===1?8000:15000); } }
  }
}
async function retryOne(i){ // 책 안 "다시 그리기" 버튼용
  setPh(i,'그림을 그리는 중이에요…',false);
  try{ await fetchOnce(i); Snd.ting(); }catch(e){ setPh(i,e.message,true); }
}

  document.querySelectorAll('#stage .page').forEach((p,i)=>p.classList.toggle('cur',i===S.page));
  document.querySelectorAll('#pgdots i').forEach((d,i)=>d.classList.toggle('cur',i===S.page));
  $('prevPg').disabled=S.page===0; $('nextPg').disabled=S.page===S.pageCount-1;
  if(!silent) Snd.page();
}
$('prevPg').onclick=()=>goPage(S.page-1);
$('nextPg').onclick=()=>goPage(S.page+1);
addEventListener('keydown',e=>{ if(!$('scr-book').classList.contains('on')) return;
  if(e.key==='ArrowRight') goPage(S.page+1); if(e.key==='ArrowLeft') goPage(S.page-1); });
let tx=null;
$('stage').addEventListener('touchstart',e=>{ tx=e.touches[0].clientX; },{passive:true});
$('stage').addEventListener('touchend',e=>{ if(tx===null||$('book').classList.contains('scroll')) return;
  const dx=e.changedTouches[0].clientX-tx; tx=null;
  if(Math.abs(dx)>50) goPage(S.page+(dx<0?1:-1)); },{passive:true});
$('viewBtn').onclick=()=>{ const b=$('book'); b.classList.toggle('scroll');
  const sc=b.classList.contains('scroll'); $('viewBtn').textContent=sc?'▤ 넘겨보기':'≡ 이어보기';
  if(!sc) goPage(S.page,true); };
$('homeBtn').onclick=()=>{ if(confirm('처음 화면으로 돌아갈까요? 지금 동화는 저장하지 않으면 사라져요.')) location.reload(); };

/* ═══════════ 다운로드 ═══════════ */
function dl(name,href){ const a=document.createElement('a'); a.href=href; a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
$('dlTxt').onclick=()=>{
  if(!S.story) return;
  const t=[S.story.title,'',S.story.protagonist,''];
  S.story.scenes.forEach((s,i)=>{ t.push('── '+CHAPS[i]+' ──','',s.text,''); });
  t.push('── 이야기를 덮으며 ──','',S.story.closing);
  dl(S.story.title+'.txt','data:text/plain;charset=utf-8,'+encodeURIComponent(t.join('\n')));
};
$('dlImg').onclick=()=>{
  const img=S.images[S.page<4?S.page:3];
  if(!img){ alert('이 장의 그림이 아직 준비되지 않았어요.'); return; }
  const names=['표지','장면1','장면2','장면3'];
  dl(S.story.title+'_'+names[Math.min(S.page,3)]+'.png',img);
};
$('dlBook').onclick=()=>{
  if(!S.story) return;
  if(S.images.some(x=>!x) && !confirm('아직 준비되지 않은 그림이 있어요. 그림 없이 저장할까요?')) return;
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const A=S.analysis;
  let pages='';
  const pg=(img,chap,inner,cls)=>`<section class="pg ${cls||''}">${img?`<div class="im"><img src="${img}" alt=""></div>`:''}<div class="tx">${chap?`<div class="ch">${esc(chap)}</div>`:''}${inner}</div></section>`;
  pages+=pg(S.images[0],(S.user.name?S.user.name+'님':'당신')+'을 위한 동화',`<h1>${esc(S.story.title)}</h1><p class="s">${esc(S.story.protagonist)}</p>`,'');
  S.story.scenes.forEach((s,i)=>{ pages+=pg(S.images[i+1],CHAPS[i],`<p class="b">${esc(s.text).replace(/\n/g,'<br>')}</p>`,''); });
  pages+=pg(null,'이야기를 덮으며',`<p class="b c">${esc(S.story.closing)}</p><p class="rx">이 동화가 지어진 이유 — 지금 마음은 ${esc(A.moodKo)}였어요. ${esc(A.senseKo)}였고, 마음이 가장 바라는 것은 ${esc(A.needKo)}이었어요. 그림은 ${esc(A.styleKo)}로 그렸습니다.</p>`,'noimg');
  const srcs=SOURCES.map(s=>`<b>${esc(s.t)}</b><span>${esc(s.d)}</span>`).join('')+`<i class="note">${esc(SRC_NOTE)}</i>`;
  pages+=pg(null,'이 이야기의 뿌리 — 참고한 연구들',`<div class="srcs">${srcs}</div>`,'noimg');
  const html=`<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>${esc(S.story.title)}</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#efe6d2;font-family:'Gowun Dodum','Apple SD Gothic Neo',sans-serif;color:#3a2f22}

.ui button.on{background:#e8b64c;border-color:#e8b64c;color:#2e2410}

 body.flip .pg.cur:not(.noimg){display:grid;grid-template-columns:1fr 1.05fr;max-width:1060px;align-items:stretch}

 body.flip .pg.cur:not(.noimg) .tx{align-self:center}

 .pg .im{height:auto!important}
 .pg .im img{width:100%;height:auto!important}
}
</style></head>
<body class="flip">

${pages}
<footer>이야기의 문에서 지어진 동화</footer>

<script>
var cur=0,pgs=[].slice.call(document.querySelectorAll('.pg'));
function g(id){return document.getElementById(id)}
function go(n){cur=Math.max(0,Math.min(pgs.length-1,n));for(var i=0;i<pgs.length;i++)pgs[i].classList.toggle('cur',i===cur);g('pgno').textContent=(cur+1)+' / '+pgs.length;window.scrollTo(0,0)}
function mode(m){document.body.className=m;g('mFlip').classList.toggle('on',m==='flip');g('mScroll').classList.toggle('on',m==='scroll');if(m==='flip')go(cur)}
g('bPrev').onclick=function(){go(cur-1)};g('bNext').onclick=function(){go(cur+1)};
g('mFlip').onclick=function(){mode('flip')};g('mScroll').onclick=function(){mode('scroll')};
g('bPrint').onclick=function(){window.print()};
addEventListener('keydown',function(e){if(document.body.className!=='flip')return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
var tx0=null;addEventListener('touchstart',function(e){tx0=e.touches[0].clientX},{passive:true});
addEventListener('touchend',function(e){if(tx0===null||document.body.className!=='flip')return;var dx=e.changedTouches[0].clientX-tx0;tx0=null;if(Math.abs(dx)>50)go(cur+(dx<0?1:-1))},{passive:true});
go(0);
<\/script></body></html>`;
  dl(S.story.title+'_동화책.html',URL.createObjectURL(new Blob([html],{type:'text/html'})));
};
</script>
</body>
