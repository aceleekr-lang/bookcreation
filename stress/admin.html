<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>숨, 고르기 · 기록 보관함</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{--bg:#0F2630;--bg2:#173846;--fg:#DDEAE7;--dim:#8DA9A7;--accent:#6FD0C0;
  --accent2:#E8B93F;--line:rgba(221,234,231,.15);--radius:14px;
  --display:"Gowun Batang",serif;--body:"Pretendard Variable",Pretendard,-apple-system,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);
  font-size:16px;line-height:1.6;letter-spacing:-.01em;padding:0 20px 60px}
.wrap{max-width:560px;margin:0 auto}
h1{font-family:var(--display);font-weight:400;font-size:1.7rem;margin:34px 0 4px}
h2{font-family:var(--display);font-weight:400;font-size:1.3rem;margin:0 0 4px}
p{margin:0 0 10px}
.dim{color:var(--dim);font-size:.87rem}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.btn{display:block;width:100%;padding:14px;border-radius:var(--radius);background:var(--accent);
  color:#07202A;font-weight:700;margin-top:10px}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--fg);font-weight:500}
.field{width:100%;padding:13px 15px;border-radius:var(--radius);background:var(--bg2);
  border:1px solid var(--line);color:var(--fg);font:inherit;margin-bottom:8px}
.view{display:none}.view.on{display:block}
:focus-visible{outline:2px solid var(--accent2);outline-offset:3px}

.toolbar{display:flex;gap:8px;margin:18px 0 6px}
.toolbar .field{margin:0}
.person{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;
  text-align:left;padding:15px 4px;border-bottom:1px solid var(--line)}
.person b{font-weight:600}
.person .sub{font-size:.8rem;color:var(--dim);display:block;margin-top:2px}
.person em{font-style:normal;font-size:.78rem;color:var(--dim);flex:0 0 auto;text-align:right}
.tag{display:inline-block;font-size:.72rem;padding:1px 7px;border-radius:999px;
  border:1px solid var(--line);margin-left:5px;vertical-align:1px}
.empty{padding:60px 0;text-align:center;color:var(--dim)}

/* 리포트 */
.rep{background:#fff;color:#1A1A22;border-radius:var(--radius);padding:28px 24px;margin:16px 0}
.rep h4{font-family:var(--display);font-size:1.5rem;font-weight:400;margin:0 0 2px}
.rep .meta{font-size:.8rem;color:#77778A;border-bottom:1px solid #E3E3EA;padding-bottom:14px;margin-bottom:20px}
.rep .big{font-family:var(--display);font-size:2.7rem;line-height:1}
.rep .big span{font-size:.95rem;color:#77778A;font-family:var(--body)}
.rtrack{height:7px;border-radius:7px;background:#EDEDF2;overflow:hidden;margin:10px 0 5px}
.rtrack i{display:block;height:100%;background:linear-gradient(90deg,#6FD0C0,#E8B93F)}
.sec{font-size:.78rem;color:#77778A;margin:24px 0 6px;border-bottom:1px solid #EDEDF2;padding-bottom:5px}
.rep table{width:100%;border-collapse:collapse;font-size:.85rem}
.rep th,.rep td{text-align:left;padding:8px 6px;border-bottom:1px solid #EDEDF2;vertical-align:top}
.rep th{color:#77778A;font-weight:500;white-space:nowrap}
.rep .foot{font-size:.76rem;color:#9A9AAB;margin-top:26px;border-top:1px solid #EDEDF2;padding-top:12px}
.spark{display:flex;align-items:flex-end;gap:5px;height:64px;margin:10px 0 4px}
.spark div{flex:1;background:#6FD0C0;border-radius:4px 4px 0 0;min-height:3px}
.sparkx{display:flex;gap:5px;font-size:.68rem;color:#9A9AAB}
.sparkx span{flex:1;text-align:center}

@media print{
  body{background:#fff;color:#000;padding:0}
  .view,.btn,h1,.back,.toolbar{display:none!important}
  #v-report{display:block!important}
  .rep{margin:0;padding:0;border-radius:0}
}
.back{font-size:.87rem;color:var(--dim);padding:10px 0;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">

<!-- 열쇠 -->
<section class="view on" id="v-key">
  <h1>기록 보관함</h1>
  <p class="dim">관리자 열쇠를 입력하세요.</p>
  <input class="field" id="key" type="password" inputmode="numeric" placeholder="열쇠"
         onkeydown="if(event.key==='Enter')load()" style="margin-top:16px">
  <button class="btn" onclick="load()">열기</button>
  <p class="dim" id="keymsg"></p>
</section>

<!-- 목록 -->
<section class="view" id="v-list">
  <h1>기록 보관함</h1>
  <p class="dim" id="info"></p>
  <div class="toolbar">
    <input class="field" id="q" placeholder="이름·연락처 검색" oninput="draw()">
    <button class="btn ghost" style="width:auto;padding:13px 16px;margin:0" onclick="csv()">전체 CSV</button>
  </div>
  <div id="list"></div>
</section>

<!-- 개인 리포트 -->
<section class="view" id="v-report">
  <div id="rep"></div>
  <button class="btn" onclick="window.print()">PDF로 저장 · 인쇄</button>
  <button class="btn ghost" onclick="personCsv()">이 사람 CSV</button>
  <button class="back" onclick="show('v-list')">← 목록으로</button>
</section>

</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const show=id=>{document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));$(id).classList.add('on');scrollTo(0,0)};
let KEY='',ITEMS=[],GROUPS=[],CUR=null;

const urlKey=new URLSearchParams(location.search).get('master');
if(urlKey){$('key').value=urlKey;load()}

async function load(){
  const k=$('key').value.trim();
  if(!k){$('keymsg').textContent='열쇠를 입력해 주세요.';return}
  $('keymsg').textContent='불러오는 중…';
  try{
    const r=await fetch('/api/stress-record?master='+encodeURIComponent(k));
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'실패');
    KEY=k;ITEMS=d.items||[];group();show('v-list');draw();
  }catch(e){
    $('keymsg').textContent=e.message==='권한 없음'?'열쇠가 맞지 않습니다.':'불러오지 못했습니다. 잠시 후 다시 시도해 주세요.';
  }
}
function group(){
  const G={};
  ITEMS.forEach(i=>{
    const k=(i.contact||i.name||i.uid||'미상').trim();
    (G[k]=G[k]||{key:k,name:i.name||'이름없음',contact:i.contact||'',consent:false,items:[]});
    G[k].items.push(i); if(i.consent)G[k].consent=true;
  });
  GROUPS=Object.values(G).map(g=>{
    g.items.sort((a,b)=>new Date(b.at)-new Date(a.at));
    g.tests=g.items.filter(i=>i.kind!=='log');
    g.logs=g.items.filter(i=>i.kind==='log');
    g.last=g.items[0];
    return g;
  }).sort((a,b)=>new Date(b.last.at)-new Date(a.last.at));
}
function draw(){
  const q=$('q').value.trim().toLowerCase();
  const rows=GROUPS.filter(g=>!q||(g.name+g.contact).toLowerCase().includes(q));
  $('info').textContent=`${GROUPS.length}명 · 기록 ${ITEMS.length}건`;
  if(!rows.length){$('list').innerHTML='<div class="empty">해당하는 기록이 없습니다.</div>';return}
  $('list').innerHTML=rows.map((g,i)=>{
    const t=g.tests[0];
    const sub=t?`검사 ${g.tests.length}회 · 최근 ${t.score}점 ${esc(t.type)}`
              :`마음 기록 ${g.logs.length}건`;
    const kid=t&&t.mode==='kid';
    return `<button class="person" onclick="open_(${GROUPS.indexOf(g)})">
      <span><b>${esc(g.name)}</b>${kid?'<span class="tag">아이</span>':''}${kid&&g.consent?'<span class="tag">동의</span>':''}
      <span class="sub">${esc(g.contact)} · ${sub}</span></span>
      <em>${new Date(g.last.at).toLocaleDateString('ko-KR')}<br>›</em></button>`;
  }).join('');
}
function open_(idx){
  const g=GROUPS[idx];if(!g)return;CUR=g;
  const dt=v=>new Date(v).toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'});
  const band=s=>s<14?'낮은 편':s<27?'보통':'높은 편';
  const t=g.tests[0];
  let h=`<div class="rep"><h4>${esc(g.name)} 님의 마음 기록</h4>
    <div class="meta">${esc(g.contact)} · 발급일 ${dt(Date.now())} · 숨, 고르기</div>`;
  if(t){
    h+=`<div class="big">${t.score}<span> / 40 · ${band(t.score)}</span></div>
      <div class="rtrack"><i style="width:${Math.min(100,t.score/40*100)}%"></i></div>
      <div style="font-size:.78rem;color:#77778A">${dt(t.at)} · ${t.mode==='kid'?'아이 모드':'어른 모드'}</div>
      <div class="sec">유형</div>
      <div style="font-size:1.1rem">${esc(t.type)}</div>
      <div style="font-size:.8rem;color:#77778A">에너지축 ${t.e>0?'+':''}${t.e} · 방향축 ${t.d>0?'+':''}${t.d}
      (양수는 밖으로, 음수는 안으로 향하는 경향)</div>`;
  }
  if(g.tests.length>1){
    const ser=[...g.tests].reverse().slice(-8);
    h+=`<div class="sec">점수 흐름</div>
      <div class="spark">${ser.map(i=>`<div style="height:${Math.max(4,i.score/40*100)}%"></div>`).join('')}</div>
      <div class="sparkx">${ser.map(i=>`<span>${new Date(i.at).getMonth()+1}/${new Date(i.at).getDate()}</span>`).join('')}</div>
      <div class="sec">검사 이력 ${g.tests.length}회</div>
      <table><tr><th>일시</th><th>점수</th><th>유형</th><th>모드</th></tr>${
        g.tests.map(i=>`<tr><td>${new Date(i.at).toLocaleDateString('ko-KR')}</td><td>${i.score}</td>
        <td>${esc(i.type)}</td><td>${i.mode==='kid'?'아이':'어른'}</td></tr>`).join('')}</table>`;
  }
  if(g.logs.length){
    h+=`<div class="sec">마음 기록 ${g.logs.length}건</div>
      <table><tr><th>일시</th><th>기분</th><th>메모</th></tr>${
        g.logs.map(i=>`<tr><td>${new Date(i.at).toLocaleDateString('ko-KR')}</td>
        <td>${i.mood}/5</td><td>${esc(i.note)}</td></tr>`).join('')}</table>`;
  }
  h+=`<div class="foot">이 문서는 진단서가 아니라 자기점검 결과를 정리한 것입니다.
      점수는 작성 시점의 상태를 나타내며, 힘든 상태가 이어질 경우 전문가 상담을 권합니다.</div></div>`;
  $('rep').innerHTML=h;show('v-report');
}
function rows(items){
  const r=[['일시','이름','연락처','구분','모드','점수','유형','에너지축','방향축','기분','메모','보호자동의']];
  items.forEach(i=>r.push([new Date(i.at).toLocaleString('ko-KR'),i.name||'',i.contact||'',
    i.kind==='log'?'기록':'검사',i.mode==='kid'?'아이':i.mode==='adult'?'어른':'',
    i.score??'',i.type||'',i.e??'',i.d??'',i.mood??'',i.note||'',i.consent?'Y':'']));
  return r;
}
function save(r,name){
  const body=r.map(x=>x.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const url=URL.createObjectURL(new Blob(['\uFEFF'+body],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);
}
function csv(){save(rows(ITEMS),'마음기록_전체.csv')}
function personCsv(){if(CUR)save(rows(CUR.items),`${CUR.name}_마음기록.csv`)}
</script>
</body>
</html>
