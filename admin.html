<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이야기의 문 · 관리자</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Gowun Dodum',sans-serif;background:radial-gradient(120% 90% at 50% 110%, #232f57 0%, #141b38 45%, #0b1029 100%);color:#f7eeda;min-height:100vh;padding:24px 16px 60px;word-break:keep-all;overflow-wrap:break-word}
.wrap{max-width:1080px;margin:0 auto}
h1{font-family:'Gowun Batang',serif;font-size:1.5rem;letter-spacing:.08em;margin-bottom:4px}
.sub{font-size:.85rem;opacity:.7;margin-bottom:22px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
input,select,button{font:inherit;color:#f7eeda;background:rgba(255,255,255,.07);border:1px solid rgba(247,238,218,.28);border-radius:10px;padding:10px 14px}
input::placeholder{color:rgba(247,238,218,.4)}
input:focus,select:focus{outline:none;border-color:#f0c36b}
select option{color:#222}
button{cursor:pointer}
button:hover{border-color:#f0c36b}
button.gold{background:linear-gradient(135deg,#f8dfa8,#f0c36b);color:#231a08;border:none;font-weight:700}
button.danger{color:#f3a08c;border-color:rgba(243,160,140,.5)}
#search{flex:1;min-width:180px}
table{width:100%;border-collapse:collapse;background:rgba(255,255,255,.04);border-radius:12px;overflow:hidden;font-size:.88rem}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid rgba(247,238,218,.1)}
th{background:rgba(255,255,255,.06);font-weight:400;color:#f8dfa8;cursor:pointer;user-select:none;white-space:nowrap}
th .arr{font-size:.7rem;opacity:.8}
tr:hover td{background:rgba(255,255,255,.03)}
td .mini{font:inherit;font-size:.78rem;padding:6px 10px;margin-right:4px}
.empty{padding:40px;text-align:center;opacity:.6}
#detail{display:none;margin-top:22px;background:#f7eeda;color:#3a2f22;border-radius:14px;padding:26px;box-shadow:0 16px 44px rgba(0,0,0,.4)}
#detail h2{font-family:'Gowun Batang',serif;margin-bottom:4px}
#detail .meta{font-size:.82rem;color:#8a7350;margin-bottom:14px}
#detail .imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:14px 0}
#detail .imgs img{width:100%;border-radius:8px;display:block}
#detail .story{white-space:pre-wrap;line-height:1.95;font-size:.95rem;font-family:'Gowun Batang',serif;margin-top:8px;text-wrap:pretty}
#detail .btns{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
#detail .btns button{background:#efe3c8;border-color:#c9b184;color:#5a4a28}
.gatebox{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px;padding:18px 22px;border-radius:16px;
  background:linear-gradient(135deg,rgba(240,195,107,.18),rgba(221,143,126,.12));border:1px solid rgba(240,195,107,.45)}
.gl{font-size:.78rem;letter-spacing:.2em;color:#f8dfa8}
.gcode{font-family:'Gowun Batang',serif;font-size:2.6rem;letter-spacing:.35em;color:#fff;text-shadow:0 0 18px rgba(240,195,107,.6);line-height:1.2}
.gside{font-size:.88rem;opacity:.9;line-height:1.9;text-align:right}
.gside b{color:#f8dfa8}
#gate{max-width:420px;margin:80px auto;text-align:center}
#gate input{width:100%;text-align:center;margin:16px 0 12px}
.note{font-size:.78rem;opacity:.6;line-height:1.7;margin-top:10px}
#stat{font-size:.82rem;opacity:.75;margin:6px 0 12px}
</style>
</head>
<body>
<div class="wrap">
  <!-- 열쇠 게이트 -->
  <div id="gate">
    <h1>이야기의 문 · 관리자</h1>
    <p class="sub">운영자 열쇠(OWNER_KEY)를 입력하세요</p>
    <input id="keyIn" type="password" placeholder="운영자 열쇠">
    <button class="gold" id="keyBtn" style="width:100%">들어가기</button>
    <p class="note">열쇠는 이 브라우저에만 저장됩니다.</p>
  </div>

  <!-- 본 화면 -->
  <div id="main" style="display:none">
    <div class="gatebox">
      <div><div class="gl">지금 문의 비밀번호</div><div class="gcode" id="gCode">·····</div></div>
      <div class="gside"><div>다음 번호까지 <b id="gLeft">--</b></div><div>대기 <b id="gQueue">0</b>명 · 진행 중 <b id="gActive">없음</b></div></div>
    </div>
    <h1>이야기의 문 · 보관함</h1>
    <p class="sub">수강생들이 만든 동화가 여기 쌓입니다. 행을 누르면 내용을 볼 수 있어요.</p>
    <div class="bar">
      <input id="search" placeholder="이름·연락처·제목 검색">
      <select id="sortSel">
        <option value="ts_desc">최신순</option>
        <option value="ts_asc">오래된순</option>
        <option value="name">이름순</option>
        <option value="title">제목순</option>
        <option value="mode">모드순</option>
      </select>
      <button id="csvBtn">목록 CSV</button>
      <button id="reloadBtn">새로고침</button>
      <button id="logoutBtn">열쇠 잠금</button>
    </div>
    <p id="stat"></p>
    <table>
      <thead><tr>
        <th title="그날의 순번 (매일 리셋)">#</th>
        <th data-k="ts">시간 <span class="arr"></span></th>
        <th data-k="name">이름 <span class="arr"></span></th>
        <th data-k="contact">연락처</th>
        <th data-k="mode">모드</th>
        <th data-k="title">제목 <span class="arr"></span></th>
        <th></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">아직 저장된 동화가 없어요.</div>

    <div id="detail"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let KEY=localStorage.getItem('sd_admin_key')||'';
let ITEMS=[], SORT='ts_desc', CUR=null;

async function api(action,id){
  const r=await fetch('/api/admin',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({key:KEY,action,id})});
  const d=await r.json();
  if(!r.ok) throw new Error(d.error||'오류');
  return d;
}
function fmt(ts){ return new Date(ts).toLocaleString('ko-KR',{dateStyle:'short',timeStyle:'short'}); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function enter(){
  try{ await api('list'); }catch(e){
    if(/열쇠/.test(e.message)){ alert(e.message); return false; }
    // 저장소 미연결 등은 통과 후 표시
  }
  localStorage.setItem('sd_admin_key',KEY);
  $('gate').style.display='none'; $('main').style.display='block';
  load(); return true;
}
$('keyBtn').onclick=()=>{ KEY=$('keyIn').value.trim(); if(KEY) enter(); };
$('keyIn').addEventListener('keydown',e=>{ if(e.key==='Enter') $('keyBtn').click(); });
$('logoutBtn').onclick=()=>{ localStorage.removeItem('sd_admin_key'); location.reload(); };

let gateTimer=null;
async function gateTick(){
  try{ const d=await api('gate');
    $('gCode').textContent=d.code; const m=Math.floor(d.left/60), s=d.left%60;
    $('gLeft').textContent=m+':'+String(s).padStart(2,'0');
    $('gQueue').textContent=d.queue; $('gActive').textContent=d.active?'1명':'없음';
  }catch(e){ $('gCode').textContent='-----'; }
}
async function load(){
  clearInterval(gateTimer); gateTick(); gateTimer=setInterval(gateTick,5000);
  $('rows').innerHTML=''; $('stat').textContent='불러오는 중…';
  try{
    const d=await api('list'); ITEMS=d.items||[];
    $('stat').textContent='총 '+ITEMS.length+'편';
    render();
  }catch(e){ $('stat').textContent='⚠ '+e.message; }
}
function sorted(list){
  const l=[...list];
  if(SORT==='ts_desc') l.sort((a,b)=>b.ts-a.ts);
  if(SORT==='ts_asc') l.sort((a,b)=>a.ts-b.ts);
  if(SORT==='name') l.sort((a,b)=>String(a.name).localeCompare(b.name,'ko'));
  if(SORT==='title') l.sort((a,b)=>String(a.title).localeCompare(b.title,'ko'));
  if(SORT==='mode') l.sort((a,b)=>String(a.mode).localeCompare(b.mode,'ko'));
  return l;
}
function render(){
  const q=$('search').value.trim().toLowerCase();
  const list=sorted(ITEMS).filter(it=>!q||[it.name,it.contact,it.title].some(v=>String(v||'').toLowerCase().includes(q)));
  const tb=$('rows'); tb.innerHTML='';
  $('empty').style.display=list.length?'none':'block';
  list.forEach(it=>{
    const tr=document.createElement('tr');
    tr.innerHTML='<td>'+(it.seq||'')+'</td><td>'+fmt(it.ts)+'</td><td>'+esc(it.name)+'</td><td>'+esc(it.contact)+'</td><td>'+esc(it.mode)+'</td><td>'+esc(it.title)+'</td>'
      +'<td><button class="mini" data-a="view">보기</button><button class="mini danger" data-a="del">삭제</button></td>';
    tr.querySelector('[data-a=view]').onclick=()=>view(it.id);
    tr.querySelector('[data-a=del]').onclick=()=>del(it.id,it.name,it.title);
    tb.appendChild(tr);
  });
}
$('search').oninput=render;
$('sortSel').onchange=e=>{ SORT=e.target.value; render(); };
document.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{
  const k=th.dataset.k;
  SORT = (k==='ts') ? (SORT==='ts_desc'?'ts_asc':'ts_desc') : k;
  $('sortSel').value = ['ts_desc','ts_asc','name','title','mode'].includes(SORT)?SORT:'ts_desc';
  render();
});
$('reloadBtn').onclick=load;

async function del(id,name,title){
  if(!confirm((name||'무명')+' 님의 「'+(title||'')+'」 기록을 삭제할까요? 되돌릴 수 없어요.')) return;
  try{ await api('delete',id); ITEMS=ITEMS.filter(x=>x.id!==id); if(CUR===id){$('detail').style.display='none';CUR=null;} render(); $('stat').textContent='총 '+ITEMS.length+'편'; }
  catch(e){ alert(e.message); }
}

async function loadImg(id,slot){
  let s='',off=0;
  while(true){
    const r=await fetch('/api/imgpart',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({recId:id,slot,offset:off})});
    const d=await r.json(); if(!r.ok) return null;
    s+=d.part; off+=d.part.length;
    if(d.done) break;
  }
  if(!s) return null;
  const p=s.indexOf('|'); return 'data:'+s.slice(0,p)+';base64,'+s.slice(p+1);
}
async function view(id){
  CUR=id; const box=$('detail'); box.style.display='block';
  box.innerHTML='<p>불러오는 중… (원본 그림이라 몇 초 걸릴 수 있어요)</p>'; box.scrollIntoView({behavior:'smooth'});
  try{
    const d=await api('get',id); const rec=d.rec;
    const imgs=[]; for(let s=0;s<4;s++) imgs.push(await loadImg(id,s));
    const A=rec.analysis||{};
    const CH=['첫 번째 이야기','두 번째 이야기','마지막 이야기'];
    let story='';
    (rec.story.scenes||[]).forEach((s,i)=>{ story+='── '+CH[i]+' ──\n'+s.text+'\n\n'; });
    story+='── 이야기를 덮으며 ──\n'+(rec.story.closing||'');
    box.innerHTML='<h2>'+esc(rec.title)+'</h2>'
      +'<div class="meta">'+esc(rec.name)+' · '+esc(rec.contact)+' · '+esc(rec.mode)+' 모드 · '+fmt(rec.ts)
      +(A.moodKo?('<br>'+esc(A.moodKo)+' / '+esc(A.needKo||'')+' / '+esc(A.styleKo||'')):'')+'</div>'
      +'<div class="imgs">'+imgs.map(x=>x?('<img src="'+x+'">'):'').join('')+'</div>'
      +'<div class="story">'+esc(rec.story.protagonist||'')+'\n\n'+esc(story)+'</div>'
      +'<div class="btns"><button id="dlHtml">동화책 HTML 저장</button><button id="dlTxt2">글 TXT 저장</button><button class="danger" id="delBtn">이 기록 삭제</button></div>';
    $('dlHtml').onclick=()=>downloadBook(rec,imgs);
    $('dlTxt2').onclick=()=>{ const a=document.createElement('a');
      a.href='data:text/plain;charset=utf-8,'+encodeURIComponent(rec.title+'\n'+rec.name+' ('+rec.contact+')\n\n'+story);
      a.download=rec.name+'_'+rec.title+'.txt'; a.click(); };
    $('delBtn').onclick=()=>del(id,rec.name,rec.title);
  }catch(e){ box.innerHTML='<p>⚠ '+esc(e.message)+'</p>'; }
}

function downloadBook(rec,imgs){
  const CH=['첫 번째 이야기','두 번째 이야기','마지막 이야기']; const A=rec.analysis||{};
  const SOURCES=[
   {t:'감정 단어 고르기 — 정서 원형 모델',d:'고른 감정 단어들을 쾌–불쾌, 각성–이완의 두 축 위에 놓고 지금의 정서 상태를 추정합니다. Russell, J. A. (1980). A circumplex model of affect. Journal of Personality and Social Psychology, 39(6).'},
   {t:'색 고르기 — 색채 정서 연구',d:'밝은 색은 긍정 정서와, 채도 높은 색은 높은 각성과 이어진다는 실험 결과를 바탕으로, 색 선택을 감정 단어와 교차 확인합니다. Valdez, P., & Mehrabian, A. (1994). Effects of color on emotions. Journal of Experimental Psychology: General, 123(4).'},
   {t:'형태 고르기 — 곡선 선호 연구와 부바-키키 효과',d:'사람은 곡선 형태를 선호하고 날카로운 형태에서 긴장과 경계를 지각합니다. Bar, M., & Neta, M. (2006). Humans prefer curved visual objects. Psychological Science, 17(8). 소리와 형태의 대응은 Köhler(1929)의 실험을 Ramachandran & Hubbard(2001)가 발전시킨 부바-키키 연구를 참고했습니다.'},
   {t:'머물고 싶은 자리 — 전망-은신 이론',d:'아늑하게 몸을 숨길 자리(은신)에 끌리면 안전의 욕구가, 탁 트인 자리(전망)에 끌리면 자율과 탐험의 욕구가 크다고 봅니다. Appleton, J. (1975). The Experience of Landscape. Wiley.'},
   {t:'바람 단어와 대리만족 — 자기결정이론',d:'자율성·유능감·관계성이라는 세 가지 기본 심리 욕구 가운데 결핍된 것을 찾아, 이야기 속 사건으로 상징적으로 채워줍니다. Deci, E. L., & Ryan, R. M. (2000). The "what" and "why" of goal pursuits. Psychological Inquiry, 11(4). 안전의 욕구는 Maslow(1943)의 동기 이론을 함께 참고했습니다.'},
   {t:'설문 대신 고르게 하기 — 투사적 기법의 전통',d:'"끌리는 것을 고르게 하면 방어 없이 내면이 드러난다"는 원리는 융의 단어연상검사(Jung, 1910)와 동기강화상담에서 쓰는 가치 카드 분류(Miller & Rollnick)의 전통에 기대고 있습니다.'},
   {t:'소리 고르기 — 음악 정서 연구',d:'느리고 낮은 소리는 이완과, 빠르고 밝은 소리는 높은 각성과 연결된다는 음악 심리학의 연구들을 참고해 그림과 이야기의 온도를 맞춥니다. Juslin, P. N., & Västfjäll, D. (2008). Emotional responses to music. Behavioral and Brain Sciences, 31(5).'},
   {t:'동화의 3장 구조 — 독서치료(비블리오테라피)',d:'주인공에게 나를 겹쳐 보고(동일시), 이야기 속 사건으로 감정을 흘려보내고(카타르시스), 새로운 눈을 얻는(통찰) 독서치료의 고전적 3단계를 따릅니다. Shrodes, C. (1949). Bibliotherapy: A theoretical and clinical-experimental study. 아이 모드의 동물 주인공은 아동이 동물 캐릭터에 더 쉽게 동일시한다는 아동 독서치료 연구들을 따른 것입니다.'}];
  const SRC_NOTE='이 앱은 심리 검사나 진단 도구가 아닙니다. 위 연구들에서 영감을 받아, 마음을 어루만지는 이야기를 짓는 창작 도구입니다.';
  const pg=(img,chap,inner,cls)=>`<section class="pg ${cls||''}">${img?`<div class="im"><img src="${img}" alt=""></div>`:''}<div class="tx">${chap?`<div class="ch">${esc(chap)}</div>`:''}${inner}</div></section>`;
  let pages='';
  pages+=pg(imgs[0],(rec.name?rec.name+'님':'당신')+'을 위한 동화',`<h1>${esc(rec.title)}</h1><p class="s">${esc(rec.story.protagonist||'')}</p>`,'');
  (rec.story.scenes||[]).forEach((s,i)=>{ pages+=pg(imgs[i+1],CH[i],`<p class="b">${esc(s.text).replace(/\n/g,'<br>')}</p>`,''); });
  const rx=A.moodKo?`<p class="rx">이 동화가 지어진 이유 — 지금 마음은 ${esc(A.moodKo)}였어요.${A.senseKo?' '+esc(A.senseKo)+'였고,':''} 마음이 가장 바라는 것은 ${esc(A.needKo||'')}이었어요.${A.memoryKo?` 꺼낸 ${esc(A.memoryKo)}은 이야기의 밑색이 되었고, '${esc(A.avoidKo||'')}'은 이야기에 들이지 않았습니다.`:''} 그림은 ${esc(A.styleKo||'')}로 그렸습니다.</p>`:'';
  pages+=pg(null,'이야기를 덮으며',`<p class="b c">${esc(rec.story.closing||'')}</p>`+rx,'noimg');
  const srcs=SOURCES.map(s=>`<b>${esc(s.t)}</b><span>${esc(s.d)}</span>`).join('')+`<i class="note">${esc(SRC_NOTE)}</i>`;
  pages+=pg(null,'이 이야기의 뿌리 — 참고한 연구들',`<div class="srcs">${srcs}</div>`,'noimg');
  const html=`<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>${esc(rec.title)}</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#efe6d2;font-family:'Gowun Dodum','Apple SD Gothic Neo',sans-serif;color:#3a2f22;word-break:keep-all;overflow-wrap:break-word}
.ui{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(239,230,210,.95);border-bottom:1px solid #d8c9a8;flex-wrap:wrap}
.ui h2{font-size:.95rem;margin:0}
.ui .bts{display:flex;gap:6px;flex-wrap:wrap}
.ui button{font:inherit;font-size:.8rem;padding:7px 12px;border-radius:99px;border:1px solid #c9b184;background:#f7eeda;cursor:pointer;color:#5a4a28}
.ui button.on{background:#e8b64c;border-color:#e8b64c;color:#2e2410}
.pg{max-width:680px;margin:26px auto;background:#f7eeda;border-radius:14px;overflow:hidden;box-shadow:0 10px 34px rgba(60,45,20,.18)}
.pg .im img{width:100%;display:block}
.tx{padding:28px 32px 38px}
.ch{font-size:.72rem;letter-spacing:.3em;color:#a3865a;margin-bottom:12px}
h1{font-size:1.8rem;margin:0 0 10px;line-height:1.5;text-wrap:balance}.s{color:#8a7350;margin:0}
.b{line-height:2.05;white-space:pre-wrap;font-size:1.05rem;margin:0;text-wrap:pretty}.c{text-align:center}
.rx{margin-top:20px;padding:16px 18px;border:1px dashed #c9b184;border-radius:12px;font-size:.88rem;line-height:1.9;color:#6b5a35;text-wrap:pretty}
.srcs{font-size:.82rem;line-height:1.8;color:#6b5a35;text-wrap:pretty}
.srcs b{display:block;color:#4a3617;margin:14px 0 3px}.srcs b:first-child{margin-top:0}
.srcs .note{display:block;margin-top:16px;padding-top:12px;border-top:1px dashed #c9b184;color:#8a7350;font-style:normal;font-size:.78rem}
.pgnav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:18px;align-items:center;padding:10px;background:rgba(239,230,210,.95);border-top:1px solid #d8c9a8}
.pgnav button{font:inherit;width:42px;height:42px;border-radius:50%;border:1px solid #c9b184;background:#f7eeda;cursor:pointer;font-size:1.1rem;color:#5a4a28}
.pgnav span{font-size:.85rem;color:#8a7350;min-width:64px;text-align:center}
footer{text-align:center;color:#a3865a;font-size:.78rem;padding:20px 0 76px}
body.flip .pg{display:none}
body.flip .pg.cur{display:block}
body.flip footer{display:none}
body.scroll .pgnav{display:none}
@media (min-width:900px){
 body.flip .pg.cur:not(.noimg){display:grid;grid-template-columns:1fr 1.05fr;max-width:1060px;align-items:stretch}
 body.flip .pg.cur:not(.noimg) .im{height:min(80vh,780px)}
 body.flip .pg.cur:not(.noimg) .im img{height:100%;object-fit:cover}
 body.flip .pg.cur:not(.noimg) .tx{align-self:center}
}
@media print{
 .ui,.pgnav,footer{display:none!important}
 body{background:#fff}
 .pg{display:block!important;grid-template-columns:none!important;max-width:100%;margin:0;border-radius:0;box-shadow:none;page-break-after:always}
 .pg .im{height:auto!important}
 .pg .im img{width:100%;height:auto!important}
}
</style></head>
<body class="flip">
<header class="ui"><h2>${esc(rec.title)}</h2>
<div class="bts"><button id="mFlip" class="on">넘겨보기</button><button id="mScroll">이어보기</button><button id="bPrint">인쇄</button></div></header>
${pages}
<footer>이야기의 문에서 지어진 동화</footer>
<nav class="pgnav"><button id="bPrev">‹</button><span id="pgno"></span><button id="bNext">›</button></nav>
<script>
var cur=0,pgs=[].slice.call(document.querySelectorAll('.pg'));
function g(id){return document.getElementById(id)}
function go(n){cur=Math.max(0,Math.min(pgs.length-1,n));for(var i=0;i<pgs.length;i++)pgs[i].classList.toggle('cur',i===cur);g('pgno').textContent=(cur+1)+' / '+pgs.length;window.scrollTo(0,0)}
function mode(m){document.body.className=m;g('mFlip').classList.toggle('on',m==='flip');g('mScroll').classList.toggle('on',m==='scroll');if(m==='flip')go(cur)}
g('bPrev').onclick=function(){go(cur-1)};g('bNext').onclick=function(){go(cur+1)};
g('mFlip').onclick=function(){mode('flip')};g('mScroll').onclick=function(){mode('scroll')};
g('bPrint').onclick=function(){window.print()};
addEventListener('keydown',function(e){if(document.body.className!=='flip')return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
var tx0=null;addEventListener('touchstart',function(e){tx0=e.touches[0].clientX},{passive:true});
addEventListener('touchend',function(e){if(tx0===null||document.body.className!=='flip')return;var dx=e.changedTouches[0].clientX-tx0;tx0=null;if(Math.abs(dx)>50)go(cur+(dx<0?1:-1))},{passive:true});
go(0);
<\/script></body></html>`;
  const aTag=document.createElement('a');
  aTag.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));
  aTag.download=(rec.name||'무명')+'_'+rec.title+'_동화책.html'; aTag.click();
}

$('csvBtn').onclick=()=>{
  const rows=[['순번','시간','이름','연락처','모드','제목'],
    ...sorted(ITEMS).map(it=>[it.seq||'',fmt(it.ts),it.name,it.contact,it.mode,it.title])];
  const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='이야기의문_목록.csv'; a.click();
};

if(KEY){ $('keyIn').value=KEY; enter(); }
</script>
